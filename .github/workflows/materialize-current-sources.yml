name: Materialize current paper and MATLAB sources

on:
  push:
    paths:
      - 'staging/current_sources/**'
      - '.github/workflows/materialize-current-sources.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decompress and verify exact sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper/current code/current

          gzip -dc staging/current_sources/Revision21_code_aligned_EN.tex.gz > paper/current/Revision21_code_aligned_EN.tex
          gzip -dc staging/current_sources/Revision21_code_aligned_CN.tex.gz > paper/current/Revision21_code_aligned_CN.tex
          gzip -dc staging/current_sources/Revision21_vs_Revision20_redline_EN.tex.gz > paper/current/Revision21_vs_Revision20_redline_EN.tex
          gzip -dc staging/current_sources/Revision21_vs_Revision20_redline_CN.tex.gz > paper/current/Revision21_vs_Revision20_redline_CN.tex
          gzip -dc staging/current_sources/all_in_one_outlier_experiment_500_verified_baseline.m.gz > code/current/all_in_one_outlier_experiment_500_verified_baseline.m
          gzip -dc staging/current_sources/run_real_dataset_two_methods_fixed.m.gz > code/current/run_real_dataset_two_methods_fixed.m

          echo '51408a125f62f1d925f09e9a0c342c7126f1f72626230e13e2d515459033312e  paper/current/Revision21_code_aligned_EN.tex' | sha256sum -c -
          echo '680d2de93bf27f8ebef798139f7e5e1c0039bbcb66cd79954b6b2c3e50790e6a  paper/current/Revision21_code_aligned_CN.tex' | sha256sum -c -
          echo 'faf1a033db30fad6456ba59f83ff1ef295102b38ae7b874543cb8ed7df14a00f  paper/current/Revision21_vs_Revision20_redline_EN.tex' | sha256sum -c -
          echo 'da54e349ce07d548ca46a1a388cdfb1fe715885e38b88ffacf05d885df382f64  paper/current/Revision21_vs_Revision20_redline_CN.tex' | sha256sum -c -
          echo 'b29434e9cbe537800395c5e03fab85a03811ca6af05ea9031c47f707b14deb06  code/current/all_in_one_outlier_experiment_500_verified_baseline.m' | sha256sum -c -
          echo '1a0dbccfb3317f1a961e039df63ce8c938ace59406e5bcc0aaa36ed9b80afa51  code/current/run_real_dataset_two_methods_fixed.m' | sha256sum -c -

      - name: Commit exact sources and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/current code/current
          git rm -r staging/current_sources
          git commit -m 'handoff: materialize exact Revision 21 and current MATLAB sources'
          git push
